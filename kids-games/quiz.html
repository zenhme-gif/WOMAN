<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>مسابقة الاجتماعية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Tajawal:wght@500;700;800&display=swap">
<style>
/* Layout: a menu of four worksheet sections; each section is a column of question cards with instant marking, colored by section */
:root{
  color-scheme: light;
  --ground:#F1F5FB;
  --card:#FFFFFF;
  --ink:#1C2541;
  --muted:#4A5578;
  --line:#D6DFEE;
  --sun:#FFB627;
  --right:#1E8A4C; --right-t:#E2F5EA;
  --wrong:#C93636; --wrong-t:#FCE6E6;
  --c-tf:#2F6FDB;  --c-tf-t:#E3EDFC;
  --c-mcq:#1E8A4C; --c-mcq-t:#E2F5EA;
  --c-num:#C2410C; --c-num-t:#FDEBDF;
  --c-fill:#7444B8; --c-fill-t:#EFE7FA;
  --display:'Baloo Bhaijaan 2', 'Tajawal', system-ui, sans-serif;
  --body:'Tajawal', system-ui, sans-serif;
}
*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink); font-family:var(--body); font-size:18px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 40px;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--ground)}
.app{max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
section{display:flex; flex-direction:column; gap:14px}
h1,h2,h3{font-family:var(--display); margin:0; text-wrap:balance; line-height:1.25}
p{margin:0}
button,input{font:inherit; color:inherit}
button{cursor:pointer; border:0; background:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun); outline-offset:2px}

.panel{background:var(--card); border-radius:26px; padding:22px 18px; display:flex; flex-direction:column; gap:16px; box-shadow:0 6px 0 var(--line)}
.btn{min-height:56px; padding:0 26px; border-radius:999px; font-family:var(--display); font-weight:800; font-size:22px; display:inline-flex; align-items:center; justify-content:center; gap:10px; transition:transform .12s}
.btn:active{transform:translateY(3px)}
.btn-main{background:var(--sun); color:var(--ink); box-shadow:0 5px 0 #C98A0B}
.btn-soft{background:var(--card); color:var(--ink); border:2px solid var(--line); box-shadow:0 5px 0 var(--line)}
.btn:disabled{opacity:.45; cursor:default; transform:none}
.btns{display:flex; flex-wrap:wrap; gap:12px; justify-content:center}

/* home */
.hero{text-align:center; align-items:center}
.hero h1{font-size:clamp(38px, 10vw, 58px); font-weight:800}
.lessons{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.lessons span{background:var(--ground); border-radius:999px; padding:5px 14px; font-weight:800; font-size:15px; color:var(--muted)}
.menu{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px}
.sec-btn{border-radius:24px; padding:18px 14px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; color:#fff; box-shadow:0 6px 0 rgba(0,0,0,.18); transition:transform .12s}
.sec-btn:active{transform:translateY(3px)}
.sec-btn .ic{width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center}
.sec-btn b{font-family:var(--display); font-size:23px; line-height:1.2}
.sec-btn small{font-size:15px; font-weight:700; opacity:.95}
.sec-btn .badge{background:#fff; color:var(--ink); border-radius:999px; padding:3px 12px; font-size:15px; font-weight:800}
.bg-tf{background:var(--c-tf)} .bg-mcq{background:var(--c-mcq)} .bg-num{background:var(--c-num)} .bg-fill{background:var(--c-fill)}
.total{font-family:var(--display); font-weight:800; font-size:22px; text-align:center}

/* section header */
.topbar{display:flex; align-items:center; gap:12px}
.icon-btn{width:48px; height:48px; flex-shrink:0; border-radius:50%; background:var(--card); box-shadow:0 4px 0 var(--line); display:inline-flex; align-items:center; justify-content:center}
.topbar h2{font-size:clamp(26px, 7vw, 34px); font-weight:800}
.instr{border-radius:18px; padding:12px 16px; font-weight:800; font-size:18px}
.progress{font-weight:800; color:var(--muted); font-size:16px; text-align:center}

/* question card */
.q{background:var(--card); border-radius:22px; padding:18px 16px; display:flex; flex-direction:column; gap:14px; box-shadow:0 4px 0 var(--line); border:3px solid transparent; transition:border-color .2s}
.q.is-right{border-color:var(--right)}
.q.is-wrong{border-color:var(--wrong)}
.q-head{display:flex; gap:12px; align-items:flex-start}
.qn{flex-shrink:0; width:38px; height:38px; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:800; font-size:19px}
.qt{font-size:clamp(20px, 5.2vw, 24px); font-weight:800; line-height:1.55; min-width:0}
.opts{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{min-height:60px; border-radius:18px; background:var(--ground); border:3px solid var(--line); font-weight:800; font-size:clamp(17px, 4.6vw, 20px); padding:8px 12px; line-height:1.35; display:flex; align-items:center; justify-content:center; gap:8px; transition:background .2s, transform .12s}
.opt:not(:disabled):active{transform:scale(.97)}
.opt:disabled{cursor:default}
.opt.right{background:var(--right-t); border-color:var(--right); color:var(--right)}
.opt.wrong{background:var(--wrong-t); border-color:var(--wrong); color:var(--wrong); animation:shake .35s}
.opt.big{font-family:var(--display); font-size:24px; min-height:68px}
.note{border-radius:14px; padding:10px 14px; font-weight:700; font-size:17px; line-height:1.5}
.note.good{background:var(--right-t); color:var(--right)}
.note.bad{background:var(--wrong-t); color:var(--wrong)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* month numbers */
.num-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.num-row{background:var(--card); border-radius:18px; padding:10px 12px; display:flex; align-items:center; gap:10px; box-shadow:0 4px 0 var(--line); border:3px solid transparent}
.num-row label{flex:1; min-width:0; font-family:var(--display); font-weight:800; font-size:clamp(17px, 4.6vw, 21px); line-height:1.2}
.num-row input{width:64px; height:56px; flex-shrink:0; text-align:center; border-radius:14px; border:3px solid var(--line); background:var(--ground); font-family:var(--display); font-weight:800; font-size:26px}
.num-row.is-right{border-color:var(--right)}
.num-row.is-right input{border-color:var(--right); background:var(--right-t); color:var(--right)}
.num-row.is-wrong{border-color:var(--wrong)}
.num-row.is-wrong input{border-color:var(--wrong); background:var(--wrong-t); color:var(--wrong)}
.num-row .fix{font-weight:800; color:var(--right); font-size:15px; flex-shrink:0}

/* month order */
.part{font-size:23px; color:var(--c-num); margin-top:6px}
.ord-slots{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px}
.oslot{min-height:66px; border-radius:14px; border:3px dashed var(--line); background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-weight:800; font-size:16px; line-height:1.2; padding:4px; text-align:center}
.oslot small{font-size:13px; color:var(--muted)}
.oslot.filled{border-style:solid; border-color:var(--c-num); background:var(--c-num-t)}
.oslot.right{border-style:solid; border-color:var(--right); background:var(--right-t); color:var(--right)}
.oslot.wrong{border-style:solid; border-color:var(--wrong); background:var(--wrong-t); color:var(--wrong)}
.oslot .fixm{font-size:12px; color:var(--right)}
.ord-pool{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; min-height:50px}
.mchip{min-height:48px; padding:0 14px; border-radius:999px; background:var(--c-num); color:#fff; font-weight:800; font-size:17px; box-shadow:0 3px 0 #8A2E08}
@media (max-width:440px){ .ord-slots{grid-template-columns:repeat(3, minmax(0,1fr))} }

/* fill blanks */
.bank-wrap{position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; padding-block:6px; background:var(--ground)}
.bank{background:var(--c-fill-t); border:3px dashed var(--c-fill); border-radius:22px; padding:12px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.bank-title{width:100%; text-align:center; font-weight:800; color:var(--c-fill); font-size:16px}
.word{min-height:46px; padding:0 16px; border-radius:999px; background:var(--c-fill); color:#fff; font-weight:800; font-size:18px; box-shadow:0 3px 0 #4E2C80; transition:opacity .2s}
.word.used{opacity:.25; box-shadow:none}
.word:disabled{cursor:default}
.blank{display:inline-flex; align-items:center; justify-content:center; min-width:110px; min-height:44px; padding:0 12px; margin:2px 4px; vertical-align:middle; border-radius:12px; border:3px dashed var(--line); background:var(--ground); font-weight:800; font-size:inherit; color:var(--c-fill)}
.blank.active{border-color:var(--c-fill); background:var(--c-fill-t)}
.blank.filled{border-style:solid; border-color:var(--c-fill); background:var(--c-fill-t)}
.blank.right{border-color:var(--right); background:var(--right-t); color:var(--right)}
.blank.wrong{border-color:var(--wrong); background:var(--wrong-t); color:var(--wrong)}
.fill-q .qt{line-height:2.1}

/* result */
.result{background:var(--card); border-radius:26px; padding:22px 18px; display:flex; flex-direction:column; gap:12px; align-items:center; text-align:center; box-shadow:0 6px 0 var(--line)}
.stars{display:flex; gap:8px}
.stars svg{width:56px; height:56px}
.res-score{font-family:var(--display); font-weight:800; font-size:44px; line-height:1}
.res-msg{font-weight:800; font-size:20px; color:var(--muted)}

@media (max-width:440px){
  .num-grid{grid-template-columns:minmax(0,1fr)}
  .menu{gap:10px}
  .sec-btn{padding:16px 8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<main class="app" dir="rtl" lang="ar">

  <section id="home">
    <div class="panel hero">
      <h1>مسابقة الاجتماعية</h1>
      <div class="lessons">
        <span>من أنا</span><span>مشاعري</span><span>أحقق هدفي</span><span>القرار المناسب</span><span>أحمي نفسي</span><span>الأشهر</span>
      </div>
      <p class="total" id="total" hidden></p>
    </div>
    <div class="menu">
      <button class="sec-btn bg-tf" data-go="tf">
        <span class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12l4 4 7-8M15 9l6 6M21 9l-6 6"/></svg></span>
        <b>صح أم خطأ</b><small>١٦ سؤالاً</small><span class="badge" id="badge-tf" hidden></span>
      </button>
      <button class="sec-btn bg-mcq" data-go="mcq">
        <span class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="M12 7h9M12 17h9M5 7l1 1 2-2"/></svg></span>
        <b>اختر الإجابة الصحيحة</b><small>١٤ سؤالاً</small><span class="badge" id="badge-mcq" hidden></span>
      </button>
      <button class="sec-btn bg-num" data-go="num">
        <span class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M10 14h1v4"/></svg></span>
        <b>رقم الشهر وترتيبه</b><small>اكتب الرقم ثم رتّب الأشهر</small><span class="badge" id="badge-num" hidden></span>
      </button>
      <button class="sec-btn bg-fill" data-go="fill">
        <span class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18h16M4 12h4M16 12h4M10 10h4v4h-4z"/></svg></span>
        <b>أكمل الفراغ</b><small>١١ جملة</small><span class="badge" id="badge-fill" hidden></span>
      </button>
    </div>
  </section>

  <section id="sec" hidden>
    <div class="topbar">
      <button class="icon-btn" id="homeBtn" aria-label="العودة إلى القائمة"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1C2541" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7M5 10v10h14V10"/></svg></button>
      <h2 id="secTitle"></h2>
    </div>
    <p class="instr" id="secInstr"></p>
    <div id="secBody" style="display:flex; flex-direction:column; gap:14px"></div>
    <div class="result" id="result" hidden>
      <div class="stars" id="stars"></div>
      <p class="res-score" id="resScore"></p>
      <p class="res-msg" id="resMsg"></p>
      <div class="btns">
        <button class="btn btn-soft" id="retryBtn">أعد المحاولة</button>
        <button class="btn btn-main" id="nextBtn"></button>
      </div>
    </div>
  </section>

</main>

<script>
/* ---------- content (from the lesson summary) ---------- */
const TF = [
  ['للأفراد صفات شخصية وصفات جسدية.', true],
  ['لون الشعر من الصفات الشخصية.', false, 'لون الشعر من الصفات الجسدية.'],
  ['الطول من الصفات الجسدية.', true],
  ['الهدوء والثقة من الصفات الجسدية.', false, 'الهدوء والثقة من الصفات الشخصية.'],
  ['أشعر بالفرح إذا فزت بالمركز الأول.', true],
  ['إذا انقطعت الكهرباء فجأة أشعر بالفرح.', false, 'إذا انقطعت الكهرباء فجأة أشعر بالخوف.'],
  ['إذا كان هدفي حماية أسناني أُكثر من تناول الحلويات.', false, 'إذا كان هدفي حماية أسناني أخفف تناول الحلويات.'],
  ['إذا تأخر والدي عن أخذي من المدرسة أذهب مع شخص غريب.', false, 'إذا تأخر والدي لا أذهب مع أحد غريب.'],
  ['من الخطر إشعال المدفأة في غرفة مغلقة.', true],
  ['يجب على الصغار صعود السلّم.', false, 'لا يجب على الصغار صعود السلّم لأنه خطير.'],
  ['إذا رأيت أخي يقف على حافة السطح أخبر أهلي فوراً.', true],
  ['زيارة بيت الجدة من القرارات التي أتخذها مع عائلتي.', true],
  ['لكل فرد منا هدف يسعى لتحقيقه باتباع خطوات توصله إليه.', true],
  ['أسباب الأهداف واحدة عند كل الناس.', false, 'تختلف أسباب الأهداف من شخص إلى آخر.'],
  ['التحدث إلى زميل جديد في الصف من القرارات التي أتخذها بنفسي.', true],
  ['الحذر والهدوء من قواعد السلامة لحماية أنفسنا.', true]
];
const MCQ = [
  ['الصفات التي تكون ظاهرة في الشكل هي الصفات:', ['الجسدية', 'الشخصية']],
  ['الصفات التي لا تظهر على شكل الفرد وإنما في سلوكه هي الصفات:', ['الشخصية', 'الجسدية']],
  ['من الصفات الجسدية:', ['لون البشرة', 'الحذر', 'التفاؤل']],
  ['من الصفات الشخصية:', ['الثقة', 'الطول', 'لون الشعر']],
  ['تختلف المشاعر حسب:', ['الموقف الذي نتعرض له', 'لون الشعر', 'الطول']],
  ['أشعر بالحزن إذا:', ['مرضت ولم أذهب في رحلة', 'فزت بالمركز الأول', 'ساعدت أمي']],
  ['إذا كان هدفي مساعدة أمي:', ['أرتّب غرفتي وألعابي', 'أترك ألعابي على الأرض', 'أنام طوال اليوم']],
  ['إذا تشاجر زملائي في الصف:', ['أخبر المعلمة لتحل المشكلة', 'أتشاجر معهم', 'أخرج من الصف']],
  ['إذا عرض عليّ شخص غريب إيصالي:', ['لا أوافق', 'أوافق وأذهب معه']],
  ['من القرارات التي أتخذها بنفسي:', ['تناول طعام أفضّله', 'مكان السكن', 'زيارة بيت الجدة']],
  ['من قواعد السلامة لحماية أنفسنا:', ['عدم الاقتراب من الأماكن المرتفعة', 'الوقوف على حافة السطح', 'إغلاق النوافذ والمدفأة مشتعلة']],
  ['نتعرض في حياتنا لمواقف مختلفة تتطلب منا:', ['اتخاذ القرار الأنسب للموقف', 'ترك الموقف دون قرار', 'البكاء']],
  ['من القرارات التي أتخذها مع عائلتي:', ['مكان السكن', 'التحدث إلى زميل جديد', 'تناول طعام أفضّله']],
  ['في الأماكن المغلقة يجب علينا:', ['فتح النوافذ', 'إغلاق كل النوافذ', 'إشعال المدفأة']]
];
const FILL = [
  ['للأفراد صفات شخصية و', 'جسدية', '.'],
  ['إذا فزت بالمركز الأول أشعر بـ', 'الفرح', '.'],
  ['إذا انقطعت الكهرباء فجأة أشعر بـ', 'الخوف', '.'],
  ['إذا كان هدفي حماية أسناني أخفف تناول', 'الحلويات', '.'],
  ['إذا تشاجر زملائي في الصف أخبر', 'المعلمة', 'لتحل المشكلة.'],
  ['من الخطر إشعال', 'المدفأة', 'في غرفة مغلقة.'],
  ['لا يجب على الصغار صعود', 'السلّم', 'لأنه خطير.'],
  ['لا يجب علينا الاقتراب من', 'النوافذ', '.'],
  ['إذا رأيت أخي يقف على حافة السطح أخبر', 'أهلي', 'فوراً.'],
  ['أول شهر في السنة هو', 'كانون الثاني', '.'],
  ['لكل فرد منا', 'هدف', 'يسعى لتحقيقه باتباع خطوات توصله إليه.']
];
const MONTHS = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];

const SEC = {
  tf:   { title:'صح أم خطأ', instr:'اقرأ الجملة، ثم اضغط «صح» أو «خطأ».', color:'tf', total:TF.length },
  mcq:  { title:'اختر الإجابة الصحيحة', instr:'اضغط على الإجابة الصحيحة.', color:'mcq', total:MCQ.length },
  num:  { title:'رقم الشهر وترتيبه', instr:'أولاً اكتب رقم كل شهر، ثم رتّب الأشهر من أول السنة إلى آخرها، واضغط «صحّح إجاباتي».', color:'num', total:24 },
  fill: { title:'أكمل الفراغ', instr:'اضغط على الفراغ، ثم اختر الكلمة المناسبة من الكلمات في الأعلى.', color:'fill', total:FILL.length }
};
const ORDER = ['tf', 'mcq', 'num', 'fill'];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const ar = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const toLatin = s => String(s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim();
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let actx = null;
function tone(freqs){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.12;
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.3);
    });
  }catch(e){}
}
const good = () => tone([523, 659, 784]);
const bad = () => tone([330, 262]);

let scores = {};
try{ scores = JSON.parse(localStorage.getItem('social-quiz-scores') || '{}') || {}; }catch(e){ scores = {}; }
function saveScores(){ try{ localStorage.setItem('social-quiz-scores', JSON.stringify(scores)); }catch(e){} }

/* ---------- navigation ---------- */
let cur = null;
function goHome(){
  $('sec').hidden = true; $('home').hidden = false; cur = null;
  let sum = 0, max = 0, any = false;
  ORDER.forEach(k => {
    const b = $('badge-' + k);
    if (scores[k] != null){ b.hidden = false; b.textContent = 'نتيجتك ' + ar(scores[k]) + ' من ' + ar(SEC[k].total); sum += scores[k]; max += SEC[k].total; any = true; }
    else b.hidden = true;
  });
  $('total').hidden = !any;
  if (any) $('total').textContent = 'مجموع نقاطك: ' + ar(sum) + ' من ' + ar(max);
  window.scrollTo(0, 0);
}
function openSec(k){
  cur = k;
  const s = SEC[k];
  $('home').hidden = true; $('sec').hidden = false;
  $('secTitle').textContent = s.title;
  $('secTitle').style.color = 'var(--c-' + s.color + ')';
  $('secInstr').textContent = s.instr;
  $('secInstr').style.background = 'var(--c-' + s.color + '-t)';
  $('secInstr').style.color = 'var(--c-' + s.color + ')';
  $('result').hidden = true;
  const body = $('secBody'); body.innerHTML = '';
  ({ tf:buildTF, mcq:buildMCQ, num:buildNum, fill:buildFill })[k](body);
  window.scrollTo(0, 0);
}
function qnum(i){ return '<span class="qn" style="background:var(--c-' + SEC[cur].color + ')">' + ar(i + 1) + '</span>'; }

const STAR = on => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6L2.5 9.3l6.6-.8z" fill="${on ? '#FFB627' : '#D6DFEE'}" stroke="${on ? '#C98A0B' : '#B8C6DE'}" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
function showResult(score){
  const k = cur, total = SEC[k].total, r = score / total;
  scores[k] = score; saveScores();
  const n = r >= 0.9 ? 3 : r >= 0.6 ? 2 : 1;
  $('stars').innerHTML = [0, 1, 2].map(i => STAR(i < n)).join('');
  $('resScore').textContent = ar(score) + ' من ' + ar(total);
  $('resMsg').textContent = n === 3 ? 'ممتاز! أنت جاهز للاختبار.' : n === 2 ? 'أحسنت! راجع الأخطاء وحاول مرة أخرى.' : 'بداية جيدة، اقرأ الدرس مرة ثانية ثم أعد المحاولة.';
  const idx = ORDER.indexOf(k);
  $('nextBtn').textContent = idx < ORDER.length - 1 ? 'القسم التالي: ' + SEC[ORDER[idx + 1]].title : 'العودة إلى القائمة';
  $('result').hidden = false;
  tone(n === 3 ? [523, 659, 784, 1047] : [523, 659]);
  setTimeout(() => $('result').scrollIntoView({ behavior:'smooth', block:'center' }), 250);
}

/* ---------- true / false ---------- */
function buildTF(body){
  let answered = 0, score = 0;
  shuffle(TF).forEach(([text, truth, fix], i) => {
    const card = el('div', 'q');
    card.appendChild(el('div', 'q-head', qnum(i) + '<p class="qt">' + esc(text) + '</p>'));
    const opts = el('div', 'opts');
    const yes = el('button', 'opt big', '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>صح');
    const no = el('button', 'opt big', '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>خطأ');
    const pickAns = (v, btn) => {
      yes.disabled = no.disabled = true;
      const ok = v === truth;
      (truth ? yes : no).classList.add('right');
      if (!ok) btn.classList.add('wrong');
      card.classList.add(ok ? 'is-right' : 'is-wrong');
      const msg = (ok ? 'إجابة صحيحة.' : 'الإجابة الصحيحة: ' + (truth ? 'صح' : 'خطأ') + '.') + (fix ? ' التصحيح: ' + fix : '');
      card.appendChild(el('p', 'note ' + (ok ? 'good' : 'bad'), esc(msg)));
      ok ? (score++, good()) : bad();
      if (++answered === TF.length) showResult(score);
    };
    yes.onclick = () => pickAns(true, yes);
    no.onclick = () => pickAns(false, no);
    opts.append(yes, no); card.appendChild(opts); body.appendChild(card);
  });
}

/* ---------- multiple choice ---------- */
function buildMCQ(body){
  let answered = 0, score = 0;
  shuffle(MCQ).forEach(([text, options], i) => {
    const correct = options[0];
    const card = el('div', 'q');
    card.appendChild(el('div', 'q-head', qnum(i) + '<p class="qt">' + esc(text) + '</p>'));
    const opts = el('div', 'opts' + (options.length === 3 ? ' one' : ''));
    const btns = shuffle(options).map(o => {
      const b = el('button', 'opt', esc(o));
      b.onclick = () => {
        btns.forEach(x => { x.disabled = true; if (x.textContent === correct) x.classList.add('right'); });
        const ok = o === correct;
        if (!ok) b.classList.add('wrong');
        card.classList.add(ok ? 'is-right' : 'is-wrong');
        card.appendChild(el('p', 'note ' + (ok ? 'good' : 'bad'), ok ? 'إجابة صحيحة.' : 'الإجابة الصحيحة: ' + esc(correct)));
        ok ? (score++, good()) : bad();
        if (++answered === MCQ.length) showResult(score);
      };
      opts.appendChild(b); return b;
    });
    card.appendChild(opts); body.appendChild(card);
  });
}

/* ---------- write the month number ---------- */
function buildNum(body){
  const grid = el('div', 'num-grid');
  const rows = shuffle(MONTHS.map((m, i) => ({ m, n:i + 1 }))).map((it, k) => {
    const row = el('div', 'num-row');
    const id = 'num-' + it.n;
    row.innerHTML = '<label for="' + id + '">' + esc(it.m) + '</label><input id="' + id + '" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="رقم شهر ' + esc(it.m) + '">';
    grid.appendChild(row);
    return { row, input:row.querySelector('input'), n:it.n };
  });
  const check = el('button', 'btn btn-main', 'صحّح إجاباتي');
  const hint = el('p', 'progress', '');
  const wrap = el('div', 'btns'); wrap.appendChild(check);
  const ordSlots = el('div', 'ord-slots');
  const ordPool = el('div', 'ord-pool');
  const ordHint = el('p', 'progress', 'اضغط على الأشهر بالترتيب، من أول شهر إلى آخر شهر. اضغط على خانة لتفريغها.');
  let placed = [], checked = false;
  const poolOrder = shuffle(MONTHS.map((_, i) => i));
  function drawOrder(){
    ordSlots.innerHTML = ''; ordPool.innerHTML = '';
    for (let k = 0; k < 12; k++){
      const s = el('button', 'oslot' + (placed[k] !== undefined ? ' filled' : ''));
      s.innerHTML = placed[k] !== undefined ? esc(MONTHS[placed[k]]) : '<small>' + ar(k + 1) + '</small>';
      s.setAttribute('aria-label', 'الخانة ' + ar(k + 1) + (placed[k] !== undefined ? ': ' + MONTHS[placed[k]] : ' فارغة'));
      s.onclick = () => { if (checked || placed[k] === undefined) return; placed.splice(k, 1); drawOrder(); };
      ordSlots.appendChild(s);
    }
    poolOrder.filter(i => !placed.includes(i)).forEach(i => {
      const c = el('button', 'mchip', esc(MONTHS[i]));
      c.onclick = () => { if (checked) return; placed.push(i); tone([620]); drawOrder(); };
      ordPool.appendChild(c);
    });
    if (!checked) check.disabled = placed.length < 12;
  }
  const update = () => {
    const filled = rows.filter(r => toLatin(r.input.value) !== '').length;
    hint.textContent = 'كتبت ' + ar(filled) + ' من ١٢';
  };
  rows.forEach((r, k) => {
    r.input.addEventListener('input', () => {
      r.input.value = r.input.value.replace(/[^0-9٠-٩۰-۹]/g, '');
      update();
    });
    r.input.addEventListener('keydown', e => { if (e.key === 'Enter' && rows[k + 1]) rows[k + 1].input.focus(); });
  });
  check.onclick = () => {
    if (placed.length < 12) return;
    let score = 0; checked = true;
    rows.forEach(r => {
      const ok = parseInt(toLatin(r.input.value), 10) === r.n;
      r.input.readOnly = true;
      r.row.classList.add(ok ? 'is-right' : 'is-wrong');
      if (ok) score++;
      else r.row.appendChild(el('span', 'fix', 'رقمه ' + ar(r.n)));
    });
    [...ordSlots.children].forEach((s, k) => {
      const ok = placed[k] === k;
      s.classList.remove('filled');
      s.classList.add(ok ? 'right' : 'wrong');
      if (ok) score++;
      else s.appendChild(el('span', 'fixm', 'الصحيح: ' + esc(MONTHS[k])));
    });
    ordHint.hidden = true;
    check.disabled = true;
    showResult(score);
  };
  body.append(el('h3', 'part', 'أولاً: اكتب رقم كل شهر'), grid, hint,
    el('h3', 'part', 'ثانياً: رتّب الأشهر من أول السنة إلى آخرها'), ordSlots, ordPool, ordHint, wrap);
  update();
  drawOrder();
}

/* ---------- fill the blank with a word bank ---------- */
function buildFill(body){
  const items = shuffle(FILL);
  const words = shuffle(items.map(f => f[1]));
  const filled = items.map(() => null);   // index into words
  let active = 0, checked = false;

  const bankWrap = el('div', 'bank-wrap');
  const bank = el('div', 'bank');
  bankWrap.appendChild(bank);
  const list = el('div', '', ''); list.style.cssText = 'display:flex; flex-direction:column; gap:14px';
  const check = el('button', 'btn btn-main', 'صحّح إجاباتي');
  const wrap = el('div', 'btns'); wrap.appendChild(check);

  const cards = items.map(([pre, ans, post], i) => {
    const card = el('div', 'q fill-q');
    const head = el('div', 'q-head', qnum(i));
    const p = el('p', 'qt');
    p.appendChild(document.createTextNode(pre + ' '));
    const blank = el('button', 'blank');
    blank.onclick = () => {
      if (checked) return;
      if (filled[i] !== null) filled[i] = null;
      active = i; draw();
    };
    p.appendChild(blank);
    p.appendChild(document.createTextNode(' ' + post));
    head.appendChild(p); card.appendChild(head); list.appendChild(card);
    return { card, blank, ans };
  });

  function nextEmpty(from){
    for (let k = 0; k < items.length; k++){ const j = (from + k) % items.length; if (filled[j] === null) return j; }
    return -1;
  }
  function draw(){
    bank.innerHTML = '<p class="bank-title">الكلمات: اختر منها</p>';
    words.forEach((w, wi) => {
      const used = filled.includes(wi);
      const b = el('button', 'word' + (used ? ' used' : ''), esc(w));
      b.disabled = used || checked;
      b.onclick = () => {
        if (checked || active < 0) return;
        filled[active] = wi; tone([620]);
        active = nextEmpty(active + 1);
        draw();
      };
      bank.appendChild(b);
    });
    cards.forEach((c, i) => {
      const w = filled[i];
      c.blank.textContent = w !== null ? words[w] : '';
      c.blank.className = 'blank' + (w !== null ? ' filled' : '') + (i === active && !checked ? ' active' : '');
      c.blank.setAttribute('aria-label', 'الفراغ رقم ' + ar(i + 1) + (w !== null ? ': ' + words[w] : ' فارغ'));
    });
    check.disabled = checked || filled.includes(null);
  }
  check.onclick = () => {
    if (filled.includes(null)) return;
    checked = true; let score = 0;
    cards.forEach((c, i) => {
      const ok = words[filled[i]] === c.ans;
      c.blank.classList.remove('filled', 'active');
      c.blank.classList.add(ok ? 'right' : 'wrong');
      c.card.classList.add(ok ? 'is-right' : 'is-wrong');
      if (ok) score++;
      else c.card.appendChild(el('p', 'note bad', 'الكلمة الصحيحة: ' + esc(c.ans)));
    });
    draw();
    showResult(score);
  };
  body.append(bankWrap, list, wrap);
  draw();
}

/* ---------- wiring ---------- */
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => openSec(b.dataset.go));
$('homeBtn').onclick = goHome;
$('retryBtn').onclick = () => openSec(cur);
$('nextBtn').onclick = () => {
  const idx = ORDER.indexOf(cur);
  if (idx < ORDER.length - 1) openSec(ORDER[idx + 1]); else goHome();
};
goHome();
</script>

</html>
